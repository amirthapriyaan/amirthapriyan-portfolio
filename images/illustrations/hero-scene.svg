<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Night city skyline with violet lights</title>
<desc id="desc">A dark futuristic city skyline with tall glass towers, subtle violet windows, atmospheric purple light and fine geometric lines.</desc>
<defs>
 <linearGradient id="heroBase" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#08070e"/><stop offset=".55" stop-color="#100a19"/><stop offset="1" stop-color="#07070c"/></linearGradient>
 <radialGradient id="heroAura" cx="0" cy="0" r="1" gradientTransform="matrix(610 0 0 440 1110 410)" gradientUnits="userSpaceOnUse"><stop stop-color="#783ba4" stop-opacity=".34"/><stop offset=".58" stop-color="#4a2869" stop-opacity=".12"/><stop offset="1" stop-color="#24152f" stop-opacity="0"/></radialGradient>
