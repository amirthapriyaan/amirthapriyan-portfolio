 <linearGradient id="heroBeam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd80e7" stop-opacity="0"/><stop offset=".5" stop-color="#a35bd3" stop-opacity=".13"/><stop offset="1" stop-color="#bd80e7" stop-opacity="0"/></linearGradient>
 <pattern id="heroWindows" width="42" height="48" patternUnits="userSpaceOnUse"><rect x="8" y="9" width="9" height="17" rx="1" fill="#b986dc" opacity=".32"/><rect x="25" y="9" width="9" height="17" rx="1" fill="#76518d" opacity=".22"/></pattern>
 <pattern id="heroGrid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" stroke="#9b67b8" stroke-opacity=".055"/></pattern>
</defs>
