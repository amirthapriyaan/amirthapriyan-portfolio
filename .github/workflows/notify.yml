name: Deployment Notification

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on success
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          echo "Deployment successful."
          echo "Live site: ${SITE_URL}"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error \
              -X POST \
              -H 'Content-type: application/json' \
              --data "{\"text\":\"Portfolio deployment succeeded: ${SITE_URL}\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL is not configured; skipping external notification."
          fi

      - name: Notify on failure
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "Deployment FAILED. Check the GitHub Actions run."
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error \
              -X POST \
              -H 'Content-type: application/json' \
              --data '{"text":"Portfolio deployment failed. Check the GitHub Actions run."}' \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL is not configured; skipping external notification."
          fi
